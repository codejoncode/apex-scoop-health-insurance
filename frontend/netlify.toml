[build]
  base    = "."
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect all routes through Next.js (handled by the plugin above)
# This is a fallback in case the plugin is not installed
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
